name: Release

on:
  push:
    tags: ["v*"]
  # Builds the wheels without publishing them when run on a branch; publishing
  # needs a v* tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_REGISTRY_URL: https://europe-north1-python.pkg.dev/prs-next/ponty/

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1-M4)
          - os: macos-14
            target: aarch64-apple-darwin
            self-hosted: false

          # Linux x86_64
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            self-hosted: false

          # Linux ARM64 (self-hosted Raspberry Pi 5)
          - os: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
            self-hosted: true

    steps:
      - name: Fix permissions (self-hosted)
        if: ${{ matrix.self-hosted }}
        run: sudo chown -R $USER:$USER ${{ github.workspace }} || true

      - uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ !matrix.self-hosted }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache Rust
        if: ${{ !matrix.self-hosted }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          # Cap Rust codegen parallelism on the self-hosted Pi 5 (8GB) so a
          # release build of all Python versions cannot OOM the host. The build
          # runs inside the manylinux container, so the runner .env does not
          # reach it — pass the cap via docker-options instead.
          docker-options: ${{ matrix.self-hosted && '-e CARGO_BUILD_JOBS=2' || '' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  publish:
    name: Publish to Artifact Registry
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install twine
        run: pip install twine

      - name: List wheels
        run: ls -la dist/

      - name: Upload to Artifact Registry
        run: |
          twine upload \
            --repository-url ${{ env.ARTIFACT_REGISTRY_URL }} \
            --username oauth2accesstoken \
            --password "${{ steps.auth.outputs.access_token }}" \
            dist/*.whl
