name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Clippy only type-checks, so it covers the `python` feature too.
      - name: Clippy
        run: cargo clippy --all-targets --features python -- -D warnings

      # Default features only: the `python` feature enables PyO3's
      # `extension-module`, which leaves the Python symbols unresolved, so a
      # test binary built with it cannot link. The wheels are built and
      # checked by the Build workflow.
      - name: Unit tests
        run: cargo test
