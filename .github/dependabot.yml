version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # A library: Cargo.toml requirements are the consumers' floors. Dependabot updates Cargo.lock only.
    versioning-strategy: lockfile-only
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    # A library: pyproject.toml floors are the consumers' floors. Dependabot updates uv.lock only.
    versioning-strategy: lockfile-only
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
